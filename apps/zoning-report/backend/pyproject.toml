[project]
name = "zoning-report-backend"
version = "0.1.0"
description = "Zoning Report — lightweight FastAPI backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "httpx>=0.28.0",
    "reportlab>=4.1",
    "python-multipart",
]

[tool.setuptools.packages.find]
where = ["app"]
