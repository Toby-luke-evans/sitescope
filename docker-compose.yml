version: "3.8"

services:
  # ── Zoning Report Backend ──
  backend:
    build:
      context: .
      dockerfile: apps/zoning-report/backend/Dockerfile
    container_name: zoning-report-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app/packages/zoning-core/src:/app/packages/spatial-engine/src:/app/apps/zoning-report/backend/app
    volumes:
      # Mount source for hot-reload during dev
      - ./packages/zoning-core/src:/app/packages/zoning-core/src:ro
      - ./packages/spatial-engine/src:/app/packages/spatial-engine/src:ro
      - ./apps/zoning-report/backend/app:/app/apps/zoning-report/backend/app:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ── Zoning Report Frontend ──
  frontend:
    build:
      context: apps/zoning-report/frontend
      dockerfile: Dockerfile
    container_name: zoning-report-frontend
    ports:
      - "3001:3001"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    volumes:
      - ./apps/zoning-report/frontend:/app:cached
      - /app/node_modules
    command: npm run dev

